name: E2E - qabiile.com public surface

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Low frequency by design - this hits a real third-party production
    # site, so it does not run on every commit and is not fanned out
    # across a parallel matrix. See rules of engagement in the assessment.
    - cron: '0 6 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test
        env:
          BASE_URL: https://qabiile.com
          # TEST_IDENTITY_EMAIL is intentionally NOT set here - the one
          # spec that performs a real form submission (QAB-E2E-022) stays
          # skipped in CI unless a maintainer explicitly wires it up as a
          # repo secret, per the rules of engagement.

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
